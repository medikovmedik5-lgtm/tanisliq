<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sənə bir sözüm var</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f4f4f4;
    font-family: Arial, sans-serif;
    padding: 20px;
}

.card {
    background: white;
    width: 100%;
    max-width: 380px;
    padding: 35px 25px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 5px 25px rgba(0,0,0,0.05);
}

h2 {
    color: #222;
    font-size: 23px;
    font-weight: 600;
}

p {
    color: #666;
    font-size: 15px;
    line-height: 1.8;
    margin-top: 22px;
}

a {
    display: inline-block;
    margin-top: 20px;
    padding: 13px 25px;
    background: #222;
    color: white;
    text-decoration: none;
    border-radius: 6px;
    font-size: 14px;
}

a:hover {
    background: #444;
}
</style>
</head>

<body>

<div class="card">

    <h2>Sənə bir sözüm var.</h2>

    <p>
        Səndən xoşum gəlir.<br>
        Səni daha yaxından tanımaq istərdim.<br><br>
        Əgər sən də istəsən, Instagram hesabım buradadır.
        İstəməsən, heç nə olmamış kimi davam edərik. :)
    </p>

    <a href="https://www.instagram.com/huseyns.28/"
       target="_blank">
       Instagram hesabım
    </a>

</div>

</body>
</html>
